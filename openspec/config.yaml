schema: spec-driven

context: |
  Tech stack: .NET 10, C#, ASP.NET Core, Razor Pages, SQLite, EWS (Exchange Web Services SOAP)
  Architecture: Clean Architecture with Domain, Application (Routing/EWS/Mail), and Presentation (Dashboard) layers
  Testing: xUnit, in-memory SQLite repositories, TDD
  Access control: none at the application layer — runs on the municipal LAN, gated at the network
  Deployment: Windows Scheduled Task (production), self-contained single-file publish
  Domain: Municipal government — Valparaíso, Chile. Conaset address-change request routing.
  All code, comments, and documentation in English. Business process diagrams in Spanish (operator-facing).
  Database: SQLite via Microsoft.Data.Sqlite. No ORM.

rules:
  _global:
    - Read and follow docs/base-standards.md before creating any artifact
    - Read docs/backend-standards.md for backend-related artifacts
    - Read docs/frontend-standards.md for Razor Page/dashboard artifacts
    - Read docs/data-model.md for database schema decisions
    - Reference docs/flujo-proceso.md as the ground-truth business process
  proposal:
    - Include a "Non-goals" section
    - Map each proposed change to a step in docs/flujo-proceso.md
  tasks:
    - Break tasks into testable units (one feature = one task group)
    - Mark tasks as [x] only when code + tests are both complete
